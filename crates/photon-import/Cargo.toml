[package]
name = "photon-import"
version.workspace = true
edition.workspace = true

[dependencies]
photon-core = { path = "../photon-core" }
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
blake3.workspace = true
rusqlite.workspace = true
rayon.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true

# Import-specific
walkdir = "2.5"
image = { version = "0.24", features = ["jpeg", "png", "tiff", "webp", "gif"] }
fast_image_resize = "6.0"
jpeg-decoder = "0.3"
exif = { package = "kamadak-exif", version = "0.6" }
infer = "0.16"
dirs = "5.0"
thumbhash.workspace = true
rawler = "0.8"
tempfile = "3.10"
libc = "0.2"
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_23"] }
lcms2 = "6"
img-parts = "0.3"
webp = "0.3"
bytemuck = "1"
# Text watermarks (cairo's own text API; already in the tree through GTK)
cairo-rs = "0.20"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "import"
harness = false
