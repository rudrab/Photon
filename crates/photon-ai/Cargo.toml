[package]
name = "photon-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inference runtime, model manager, and hardware acceleration for Photon"

[dependencies]
photon-core = { path = "../photon-core" }
anyhow.workspace = true
log.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
sha2 = "0.10"
dirs = "5.0"
image = { version = "0.24", features = ["jpeg", "png"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
openvino = { version = "0.11", features = ["runtime-linking"] }

[dev-dependencies]
tempfile = "3.10"
