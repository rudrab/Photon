[package]
name = "photon-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast, modern photo management application for GNOME"

[[bin]]
name = "photon"
path = "src/main.rs"

[package.metadata.generate-rpm]
name = "photon"
summary = "Fast, modern photo management application for GNOME"
license = "GPL-3.0-or-later"
assets = [
    { source = "target/release/photon", dest = "/usr/bin/photon", mode = "755" },
    { source = "assets/org.mavensgroup.photon.desktop", dest = "/usr/share/applications/org.mavensgroup.photon.desktop", mode = "644" },
    { source = "assets/org.mavensgroup.photon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/org.mavensgroup.photon.svg", mode = "644" }
]
auto-req = "yes"

[dependencies]
photon-core = { path = "../photon-core" }
photon-import = { path = "../photon-import" }
photon-ai = { path = "../photon-ai" }
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
crossbeam-channel.workspace = true
rusqlite.workspace = true

# GTK4 / libadwaita
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
async-channel = "2.3"
dirs = "5.0"
thumbhash.workspace = true
rayon.workspace = true
image = { version = "0.24", features = ["jpeg", "png"] }
