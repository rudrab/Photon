[workspace]
resolver = "2"
members = [
    "crates/photon-core",
    "crates/photon-import",
    "crates/photon-app",
    "crates/photon-ai",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"

[workspace.dependencies]
# Shared across crates
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
blake3 = "1.5"
rusqlite = { version = "0.31", features = ["bundled", "column_decltype"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rayon = "1.10"
crossbeam-channel = "0.5"
thiserror = "1.0"
thumbhash = "0.1"

# Debug builds (`cargo run`) with optimised dependencies: unoptimised image
# decoding, JPEG encoding and RAW demosaicing make exports and full-resolution
# renders 2–10× slower. Photon's own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
