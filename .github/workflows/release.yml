name: Release

# Independent of the docs: push a tag starting with "v" (e.g. v0.5.0) to test
# the code, build the Flatpak and attach it to a GitHub release. "test-v*" tags
# build everything but leave the release as a draft.
#
# Linux builds ship as a Flatpak only (the RPM was dropped in 0.5.0: distro
# packages kept breaking on library versions). GitHub adds the source code
# archives to every release by itself.
on:
  push:
    tags:
      - 'v*'
      - 'test-v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Tests, on Fedora: its packages are new enough for Photon's libraries
  # (libheif >= 1.23, libadwaita >= 1.4).
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          set -e
          dnf -y install \
            gcc gcc-c++ make pkgconf-pkg-config \
            rust cargo \
            gtk4-devel libadwaita-devel lcms2-devel libheif-devel \
            git tar findutils

      - name: Check library versions
        run: |
          set -e
          echo "libheif $(pkg-config --modversion libheif)"
          pkg-config --atleast-version=1.23 libheif
          echo "libadwaita $(pkg-config --modversion libadwaita-1)"
          pkg-config --atleast-version=1.4 libadwaita-1

      - uses: actions/checkout@v4

      - name: Run tests
        run: cargo test --release --locked --workspace

  # ---------------------------------------------------------------------------
  # The Flatpak (flatpak/org.mavensgroup.photon.yml), built in Flathub's GNOME
  # 51 image with their builder action. Crates are vendored from Cargo.lock by
  # flatpak-cargo-generator (same pinned commit as flatpak/build.sh).
  # ---------------------------------------------------------------------------
  flatpak:
    name: Build Flatpak
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      TOOLS_COMMIT: 9d86d336a39b9af38b86f114b6ce5820fe260f91
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Cargo sources
        run: |
          set -e
          python3 -m venv /tmp/gen
          /tmp/gen/bin/pip install --quiet "aiohttp>=3.9.5,<4" "PyYAML>=6.0.2,<7" "tomlkit>=0.13.3,<1"
          curl -fsSL -o /tmp/flatpak-cargo-generator.py \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/$TOOLS_COMMIT/cargo/flatpak-cargo-generator.py"
          /tmp/gen/bin/python /tmp/flatpak-cargo-generator.py Cargo.lock -o flatpak/cargo-sources.json

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: flatpak/org.mavensgroup.photon.yml
          bundle: photon.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Checksum
        run: sha256sum photon.flatpak > photon.flatpak.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            photon.flatpak
            photon.flatpak.sha256

  # ---------------------------------------------------------------------------
  # Create the GitHub release only after the build succeeded. Photon is beta,
  # so releases are marked as pre-releases; test-v* tags stay drafts.
  # ---------------------------------------------------------------------------
  publish:
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: dist

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cat > notes.md <<'NOTES'
          > **Beta.** Keep backups of your photos and catalogue.

          ### Install (any Linux distribution, x86_64)

          Download `photon.flatpak`, then:

              flatpak install --user ./photon.flatpak
              flatpak run org.mavensgroup.photon

          The GNOME runtime comes from Flathub (add it once with
          `flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo`).
          The Flatpak uses the same library folders as a build from source, and your own
          darktable, exiftool and editors. AI analysis runs on the CPU (OpenVINO is included);
          download the models from Preferences → AI. See the
          [documentation](https://rudrab.github.io/Photon/installation.html).

          Other platforms: build from the source code below.
          NOTES

          DRAFT=""
          case "${{ github.ref_name }}" in test-v*) DRAFT="--draft" ;; esac

          gh release create "${{ github.ref_name }}" \
            $DRAFT --prerelease \
            --title "Photon ${{ github.ref_name }}" \
            --generate-notes \
            --notes-file notes.md \
            dist/photon.flatpak dist/photon.flatpak.sha256
